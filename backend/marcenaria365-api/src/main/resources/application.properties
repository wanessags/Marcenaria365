spring.application.name=marcenaria365-api

# PostgreSQL - local ou Supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marcenaria365_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Servidor
app.jwt.secret=${JWT_SECRET}
server.port=${PORT:8080}
server.address=0.0.0.0

# Recuperação: credenciais fornecidas somente pelo ambiente.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.recovery.from=${MAIL_FROM:}
app.recovery.encryption-key=${RECOVERY_ENCRYPTION_KEY:}
app.recovery.worker-enabled=${RECOVERY_WORKER_ENABLED:true}
