spring.application.name=marcenaria365-api

# PostgreSQL - local ou Supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marcenaria365_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Pool dimensionado para o plano gratuito do Render (512 MB) e para o limite de
# conexões do Supabase. O padrão do Hikari abria 10 conexões ociosas na inicialização.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# Tempo máximo aguardando uma conexão do pool; evita requisição pendurada.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:15000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Limita consultas lentas para a API responder mesmo com o banco degradado.
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:20000}

# Servidor
app.jwt.secret=${JWT_SECRET}
server.port=${PORT:8080}
server.address=0.0.0.0

# Recuperação: credenciais fornecidas somente pelo ambiente.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.recovery.from=${MAIL_FROM:}
app.recovery.encryption-key=${RECOVERY_ENCRYPTION_KEY:}
app.recovery.worker-enabled=${RECOVERY_WORKER_ENABLED:true}
